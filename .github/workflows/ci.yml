name: CI

# No path filters: a required check that is skipped by one would block the pull request.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # keeps the README badge up to date

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install pre-commit -r backend/requirements-dev.txt
      # Ruff runs through pre-commit, so its version is set only in .pre-commit-config.yaml.
      - name: Ruff lint
        run: pre-commit run ruff-check --all-files --show-diff-on-failure
      - name: Ruff format
        if: ${{ !cancelled() }}
        run: pre-commit run ruff-format --all-files --show-diff-on-failure
      - name: pytest
        if: ${{ !cancelled() }}
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Vitest
        if: ${{ !cancelled() }}
        run: npm test
