# Setup and usage: see "Linting and formatting" in CONTRIBUTING.md.
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ESLint and Prettier run from frontend/node_modules, so package-lock.json is the only
  # place their versions are set. Calling them through `node` also works on Windows.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: node frontend/node_modules/eslint/bin/eslint.js
        args: [--fix, --max-warnings=0, --no-warn-ignored]
        files: ^frontend/.*\.(js|mjs|cjs|jsx|ts|mts|cts|tsx)$
      - id: prettier
        name: prettier
        language: system
        entry: node frontend/node_modules/prettier/bin/prettier.cjs
        args: [--write, --ignore-unknown, --ignore-path=frontend/.prettierignore]
        files: ^frontend/
        types: [text]
